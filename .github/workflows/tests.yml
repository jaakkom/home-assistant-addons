name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autoterm_flow5/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r autoterm_flow5/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: autoterm_flow5
        run: python -m unittest discover -s autoterm_flow5/tests -v
