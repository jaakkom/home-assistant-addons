configuration:
  simulation:
    name: Simulointi
    description: Käytä ilman lämmitintä. Pidä pois päältä, kun Flow 5 on kytketty.
    fields:
      simulate:
        name: Simulointi
        description: Aja ilman UART-laitetta. Sisäinen lämmitin vastaa samoihin kehyksiin, joten Home Assistantia voi testata ilman laitetta.
      simulate_room_temperature:
        name: Simuloitu huonelämpö
        description: Huonelämpö, kun simulointi on päällä eikä Home Assistantin lämpötilaentiteettejä ole asetettu. Arvoa voi muuttaa myös Simulated room temperature -numerosta.
      simulate_outdoor_temperature:
        name: Simuloitu ulkolämpö
        description: Ulkolämpö, kun simulointi on päällä eikä ulkolämpöentiteettiä ole asetettu.
      simulate_fault_code:
        name: Simuloitu vikakoodi
        description: Vikakoodi, jonka simuloitu lämmitin ilmoittaa. Nolla tarkoittaa ei vikaa. Asetusta ei käytetä, kun simulointi on pois päältä.
  device:
    name: Laiteliitäntä
    description: USB-UART-linkki, joka korvaa ohjauspaneelin.
    fields:
      serial_port:
        name: Sarjaportti
        description: USB-UART-laite, esimerkiksi /dev/ttyUSB0. Sovittimen pitää olla 5 V TTL.
      baud:
        name: Siirtonopeus
        description: Flow 5 käyttää 2400 baud, 8N1.
      extended_telemetry:
        name: Laajennettu telemetria
        description: Pyydä 58 tavun diagnostiikkakehys, josta saadaan pumpun taajuus ja jännite.
      debug:
        name: Debug-loki
        description: Kirjaa lisäosan lokiin, saapuuko 58 tavun telemetriakehys. Ei muuta lämmittimen ohjausta. Sama kytkin Home Assistantissa vaikuttaa heti.
  temperature:
    name: Lämpötilan ohjaus
    description: Home Assistantin anturit ja termostaatin alkuarvot.
    fields:
      temperature_entities:
        name: Lämpötilaentiteetit
        description: Pilkulla erotetut Home Assistant -entiteetit, jotka ohjaavat lämmitintä.
      outdoor_temperature_entity:
        name: Ulkolämpötilaentiteetti
        description: Home Assistant -entiteetti ulkolämpötilalle. Adaptiivinen nestelämmön ohjaus käyttää sitä.
      aggregation:
        name: Lämpötilan yhdistely
        description: min käyttää kylmintä, avg keskiarvoa ja max kuuminta anturia.
      room_target:
        name: Huoneen tavoite
        description: Ensimmäinen tavoitelämpötila, °C.
      adaptive_enabled:
        name: Adaptiivinen nestelämmön ohjaus
        description: Säätää nestetavoitetta automaattisesti pidempiä käyntijaksoja ja vähemmän sytytyksiä varten. Oletus pois.
      adaptive_coolant_min:
        name: Nestetavoitteen alaraja
        description: Matalin nestetavoite, jonka adaptiivinen ohjaus saa valita (°C).
      adaptive_coolant_max:
        name: Nestetavoitteen yläraja
        description: Korkein nestetavoite, jonka adaptiivinen ohjaus saa valita (°C).
      adaptive_min_burn_minutes:
        name: Vähimmäispolttoaika ennen pysäytystä
        description: Adaptiivinen ohjaus ei pysäytä lämmitintä ennen kuin polttovaihe on kestänyt näin monta minuuttia.
      adaptive_max_stops_6h:
        name: Pysäytyksiä enintään 6 h aikana
        description: Kun raja täyttyy, aktiiviset korjaukset pysähtyvät ja lokiin tulee varoitus.
      adaptive_rise_offset:
        name: NOUSU-tilan kynnys
        description: Jos huone on tätä enemmän alle tavoitteen (°C), käytetään korkeaa nestetavoitetta ilman aktiivisia korjauksia.
      adaptive_rise_target:
        name: NOUSU-tilan nestetavoite
        description: Nestetavoite NOUSU-tilassa (°C).
  timing:
    name: Käyntiajat
    description: Esilämmityksen kesto ja se, milloin huonelukema on liian vanha lähetettäväksi.
    fields:
      sensor_stale_minutes:
        name: Anturin vanheneminen
        description: Tätä vanhempaa huonelukemaa ei lähetetä lämmittimelle.
      preheat_minutes:
        name: Esilämmityksen kesto
        description: Esilämmityksen ensimmäinen kesto minuutteina.
      circulation_pump:
        name: Kierto odotuksessa
        description: Käytä kiertovesipumppua, kun lämpöä vielä tarvitaan ja poltin on sammuksissa.
  protection:
    name: Jännite
    description: Paikallinen suoja esilämmitykselle ja pumpputilalle. Lämmittimen omat lämpötila-asetukset ovat lisäosan sivulla ja Home Assistantin entiteeteissä.
    fields:
      shutdown_voltage:
        name: Sammutusjännite
        description: Pysäytä esilämmitys tai pumpputila, jos syöttöjännite pysyy tämän alapuolella.
      shutdown_voltage_seconds:
        name: Sammutusjännitteen aika
        description: Kuinka kauan jännitteen pitää olla alhaalla ennen pysäytystä.
  fuel:
    name: Polttoaine
    description: Pumpun annos ja tankin koko, joilla kulutus ja polttoaineen määrä lasketaan.
    fields:
      pump_dose_ml:
        name: Pumpun annos
        description: Millilitraa iskua kohti. 0,044 vastaa 12 V:n TH-11-pumppua.
      tank_capacity_l:
        name: Tankin koko
        description: Polttoainetankin koko litroina. Nolla jättää määrän tuntemattomaksi, kunnes koko on asetettu.
  mqtt:
    name: MQTT
    description: Jätä tyhjäksi, niin käytetään Supervisorin Mosquitto-brokeria.
    fields:
      mqtt_host:
        name: MQTT-osoite
        description: Jätä tyhjäksi, niin käytetään Supervisorin Mosquitto-palvelua.
      mqtt_port:
        name: MQTT-portti
      mqtt_username:
        name: MQTT-käyttäjä
      mqtt_password:
        name: MQTT-salasana
