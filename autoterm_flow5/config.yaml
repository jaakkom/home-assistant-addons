name: Autoterm Flow 5
version: "0.5.1"
slug: autoterm_flow5
description: >-
  Replaces the Autoterm Flow 5 control panel. Controls and monitors the
  heater over a USB-UART adapter and publishes status to Home Assistant.
url: https://github.com/jaakkom/home-assistant-addonss
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
startup: services
boot: auto
uart: true
usb: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: Autoterm Flow 5
panel_admin: true
services:
  - mqtt:want
options:
  simulation:
    simulate: false
    simulate_room_temperature: 15
    simulate_outdoor_temperature: 0
    simulate_fault_code: 0
  device:
    serial_port: /dev/ttyUSB0
    baud: 2400
    extended_telemetry: true
    debug: false
  temperature:
    temperature_entities: ""
    outdoor_temperature_entity: ""
    aggregation: min
    room_target: 20
    adaptive_enabled: false
    adaptive_coolant_min: 45
    adaptive_coolant_max: 85
    adaptive_min_burn_minutes: 20
    adaptive_max_stops_6h: 2
    adaptive_rise_offset: 1.0
    adaptive_rise_target: 75
  timing:
    sensor_stale_minutes: 15
    preheat_minutes: 30
    circulation_pump: false
  protection:
    shutdown_voltage: 11.5
    shutdown_voltage_seconds: 30
  fuel:
    pump_dose_ml: 0.044
    tank_capacity_l: 0
  mqtt:
    mqtt_host: ""
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
schema:
  simulation:
    simulate: bool
    simulate_room_temperature: float(0,40)
    simulate_outdoor_temperature: float(-40,40)
    simulate_fault_code: int(0,255)
  device:
    serial_port: str
    baud: int(1200,115200)
    extended_telemetry: bool
    debug: bool
  temperature:
    temperature_entities: str?
    outdoor_temperature_entity: str?
    aggregation: list(min|avg|max)
    room_target: float(0,40)
    adaptive_enabled: bool
    adaptive_coolant_min: float(20,95)
    adaptive_coolant_max: float(20,95)
    adaptive_min_burn_minutes: int(0,240)
    adaptive_max_stops_6h: int(0,10)
    adaptive_rise_offset: float(0.3,10)
    adaptive_rise_target: float(40,95)
  timing:
    sensor_stale_minutes: int(1,120)
    preheat_minutes: int(1,480)
    circulation_pump: bool
  protection:
    shutdown_voltage: float(9,30)
    shutdown_voltage_seconds: int(1,600)
  fuel:
    pump_dose_ml: float(0.01,0.2)
    tank_capacity_l: float(0,500)
  mqtt:
    mqtt_host: str?
    mqtt_port: port?
    mqtt_username: str?
    mqtt_password: password?
